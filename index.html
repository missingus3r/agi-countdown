<style>

@keyframes headerGlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}

*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;background:#0c0c11;color:#d0d0d8;font-family:'Courier New',Courier,monospace}

.header{background:linear-gradient(180deg,#101018 0%,#0c0c11 100%);border-bottom:1px solid #1e1e28;padding:20px 20px 14px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{max-width:1200px;margin:0 auto}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.filter-label input{accent-color:#eee}
.dot-closed{width:9px;height:9px;border-radius:50%;background:#f472b6;display:inline-block}
.dot-open{width:9px;height:9px;border-radius:50%;background:#34d399;display:inline-block}
.sep{width:1px;height:16px;background:#222;margin:0 4px}

.type-btn{padding:3px 10px;border-radius:12px;font-size:10px;font-family:'IBM Plex Mono';cursor:pointer;border:1px solid #1e1e28;background:transparent;color:#555}

.filters select{padding:4px 8px;border-radius:8px;border:1px solid #333;background:#16161e;color:#ccc;font-size:11px;font-family:'IBM Plex Mono';cursor:pointer;min-width:60px}

.content{max-width:1200px;margin:0 auto;padding:16px 20px 40px}

.chart-container{position:relative;width:100%;height:clamp(340px,50vh,520px);background:#08080c;border:1px solid #1a1a22;border-radius:6px;overflow:hidden;margin-bottom:24px}
.grid-line-y{position:absolute;height:1px}
.grid-label-y{position:absolute;left:4px;transform:translateY(-50%);font-size:9px;color:#333;font-family:'IBM Plex Mono'}
.grid-line-x{position:absolute;width:1px}
.grid-label-x{position:absolute;bottom:6px;transform:translateX(-50%);font-size:10px;color:#444;font-family:'IBM Plex Mono';font-weight:500}
.y-axis-label{position:absolute;left:0;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:8px;color:#333;font-family:'IBM Plex Mono';letter-spacing:1.5px}

.point{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;transition:all 0.12s;opacity:0.8}
.point.closed-point{background:#f472b6;border:none}
.point.open-point{background:#34d399;border:none}
.point:hover{opacity:1;z-index:100!important;box-shadow:0 0 16px rgba(255,255,255,0.35)}

.tooltip{position:absolute;background:#16161e;border:1px solid #2a2a35;border-radius:5px;padding:8px 12px;white-space:nowrap;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,0.8);pointer-events:none;display:none}
.point:hover .tooltip{display:block}
.tooltip .t-name{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;color:#fff}
.tooltip .t-meta{font-size:10px;color:#777;margin-top:2px;font-family:'IBM Plex Mono'}
.tooltip .t-stats{font-size:10px;color:#aaa;margin-top:2px;font-family:'IBM Plex Mono'}
.tooltip .t-stats b{color:#fff}

.trend-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3}

.chart-footer{font-size:8px;color:#444;font-family:'IBM Plex Mono';line-height:1.7;padding:6px 0 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.chart-footer .trend-line{color:#f472b6}

.year-section{margin-bottom:20px}
.year-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.year-header .year-title{font-family:'IBM Plex Mono';font-size:17px;font-weight:700;color:#ddd}
.year-header .year-count{font-family:'IBM Plex Mono';font-size:11px;color:#555}
.year-header .year-line{flex:1;height:1px;background:#1a1a22}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.card{background:#0e0e14;border:1px solid #1a1a22;border-radius:6px;padding:9px 11px;position:relative;overflow:visible;transition:border-color 0.15s}
.card:hover{border-color:#333}
.card.highlight{animation:cardPulse 5s ease-out forwards}
.card .accent{position:absolute;top:0;left:0;right:0;height:2px;opacity:0.35;border-radius:6px 6px 0 0}
.card .card-top{display:flex;justify-content:space-between;align-items:flex-start}
.card .card-info{flex:1;min-width:0}
.card .card-name{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .card-meta{font-size:10px;color:#666;font-family:'IBM Plex Mono';margin-top:1px}
.card .badges{display:flex;gap:3px;flex-shrink:0;align-items:center}
.badge{font-size:7px;padding:2px 5px;border-radius:6px;font-weight:700;font-family:'IBM Plex Mono'}
.badge-open{background:rgba(52,211,153,0.12);color:#34d399;letter-spacing:0.5px}
.card .bar-section{margin-top:7px}
.card .bar-label{font-size:7px;color:#444;margin-bottom:2px;font-family:'IBM Plex Mono';letter-spacing:0.5px}
.card .bar-bg{height:4px;border-radius:2px;background:#151520;overflow:hidden}
.card .bar-fill{height:100%;background:linear-gradient(90deg,#6b8aff,#c084fc);border-radius:2px}

.page-footer{margin-top:16px;font-size:8px;color:#ccc;font-family:'IBM Plex Mono';line-height:1.7;border-top:1px solid #1a1a22;padding-top:12px}

.card-number{color:#555;font-size:10px;font-weight:400}
.card-meta a{color:#5bc0be;text-decoration:none;transition:color 0.15s}
.card-meta a:hover{color:#8de8e6}
.sort-btn{padding:3px 10px;border-radius:12px;font-size:10px;font-family:'IBM Plex Mono';cursor:pointer;border:1px solid #1e1e28;background:transparent;color:#555;transition:all 0.15s}
.sort-btn.active{border-color:#555;background:#1a1a24;color:#ccc}
.intel-rank{color:#fbbf24;font-size:10px;font-weight:600}
.tooltip a.t-link{color:#6b8aff;text-decoration:none;font-size:10px;margin-left:4px}

.search-input{padding:4px 8px;border-radius:8px;border:1px solid #333;background:#16161e;color:#ccc;font-size:11px;font-family:'IBM Plex Mono';width:180px;outline:none}
.search-input:focus{border-color:#6b8aff}

.stats-bar{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0 16px;border-bottom:1px solid #1a1a22;margin-bottom:16px}
.stat-item{font-family:'IBM Plex Mono';font-size:11px;color:#888}

@keyframes pointAppear{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:0.8}}
.point.hidden-point{opacity:0!important;transform:translate(-50%,-50%) scale(0)!important}
.point.appear{animation:pointAppear 0.3s ease-out forwards}
.play-btn{padding:3px 10px;border-radius:12px;font-size:10px;font-family:'IBM Plex Mono';cursor:pointer;border:1px solid #1e1e28;background:transparent;color:#555;transition:all 0.15s}
.play-btn.playing{border-color:#f472b6;color:#f472b6}

.chart-container.crosshair{cursor:crosshair}
.zoom-sel{position:absolute;border:1px solid rgba(107,138,255,0.6);background:rgba(107,138,255,0.08);pointer-events:none;z-index:50;border-radius:2px}
.zoom-reset{position:absolute;top:6px;right:6px;z-index:60;padding:3px 10px;border-radius:12px;font-size:10px;font-family:'IBM Plex Mono';cursor:pointer;border:1px solid #6b8aff;background:rgba(107,138,255,0.12);color:#6b8aff;transition:all 0.15s}

.zoom-info{position:absolute;bottom:6px;right:6px;z-index:60;font-size:8px;font-family:'IBM Plex Mono';color:#555}

.theme-btn{padding:3px 10px;border-radius:12px;font-size:10px;font-family:'IBM Plex Mono';cursor:pointer;border:1px solid #1e1e28;background:transparent;color:#555;transition:all 0.15s}
.theme-btn:hover{border-color:#555;color:#ccc}

.lang-btn{padding:3px 8px;border-radius:12px;font-size:10px;font-family:'IBM Plex Mono';cursor:pointer;border:1px solid #1e1e28;background:transparent;color:#555;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.5px}

@keyframes countUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes newPulse{0%{opacity:1}50%{opacity:0.5}100%{opacity:1}}
.bar-fill.animate{animation:barGrow 0.6s ease-out forwards}
.bar-label.animate{animation:countUp 0.3s ease-out both}
.badge-new{background:rgba(239,68,68,0.12);color:#ef4444;letter-spacing:0.5px;animation:newPulse 2s ease-in-out 3;box-shadow:0 0 6px rgba(239,68,68,0.4)}

.card-tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--bg-surface,#16161e);border:1px solid #2a2a35;border-radius:5px;padding:8px 10px;white-space:nowrap;z-index:300;box-shadow:0 8px 28px rgba(0,0,0,0.8);pointer-events:none;display:none;min-width:180px}

.card-tooltip .ct-bars{display:flex;flex-direction:column;gap:3px}
.card-tooltip .ct-row{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono';font-size:9px;color:var(--t-soft,#aaa)}

.card-tooltip .ct-bar-bg{flex:1;height:3px;border-radius:2px;background:#151520;min-width:60px;overflow:hidden}

.card-tooltip .ct-bar-fill{height:100%;border-radius:2px}
.card-tooltip .ct-label{font-family:'IBM Plex Mono';font-size:8px;color:var(--t-ghost,#444);margin-top:4px;text-align:center}

</div>

function detectLang(){
  const saved=localStorage.getItem('tmlang');
  if(saved&&i18n[saved])return saved;
  try{
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    if(/Sao_Paulo|Recife|Fortaleza|Bahia|Belem|Manaus|Cuiaba|Porto_Velho|Noronha|Rio_Branco|Boa_Vista|Macapa|Santarem|Lisboa|Lisbon|Azores|Madeira/.test(tz))return'pt';
    if(/Mexico|Bogota|Buenos_Aires|Argentina|Lima|Santiago|Caracas|Montevideo|Asuncion|La_Paz|Guayaquil|Havana|Tegucigalpa|Managua|Guatemala|El_Salvador|Costa_Rica|Panama|Madrid|Canary|Santo_Domingo/.test(tz))return'es';
  }catch(e){}
  const nav=(navigator.language||'en').toLowerCase();
  if(nav.startsWith('pt'))return'pt';
  if(nav.startsWith('es'))return'es';
  return'en';
}

function playTimeline(){
  playingTimeline=true;
  const btn=document.getElementById("playBtn");
  btn.textContent="⏹ Stop";
  btn.classList.add("playing");
  const points=[...document.querySelectorAll("#chart .point")];
  // Get model data index from each point to sort by date
  const filtered=getFiltered();
  points.forEach(p=>p.classList.add("hidden-point"));
  const delay=Math.max(30,Math.min(80,3000/points.length));
  points.forEach((p,i)=>{
    const tid=setTimeout(()=>{
      p.classList.remove("hidden-point");
      p.classList.add("appear");
    },delay*i);
    playTimeouts.push(tid);
  });
  const endTid=setTimeout(()=>{
    playingTimeline=false;
    btn.textContent="▶ Play";
    btn.classList.remove("playing");
    playTimeouts=[];
  },delay*points.length+400);
  playTimeouts.push(endTid);
}

function stopTimeline(){
  playTimeouts.forEach(t=>clearTimeout(t));
  playTimeouts=[];
  playingTimeline=false;
  const btn=document.getElementById("playBtn");
  btn.textContent="▶ Play";
  btn.classList.remove("playing");
  document.querySelectorAll("#chart .point").forEach(p=>{
    p.classList.remove("hidden-point","appear");
  });
}

function fmtDate(d){return new Date(d+"T00:00:00").toLocaleDateString(t('loc'),{month:"short",day:"numeric"})}

function getFiltered(){
  return models.filter(m=>{
    if(m.open&&!showOpen)return false;
    if(!m.open&&!showClosed)return false;
    if(typeFilter==="Non-Reasoning"){if(m.type==="Reasoning")return false}
    else if(typeFilter!=="all"&&m.type!==typeFilter)return false;
    if(catFilter!=="all"&&m.cat!==catFilter)return false;
    if(searchQuery){
      const q=searchQuery.toLowerCase();
      if(!m.name.toLowerCase().includes(q)&&!m.company.toLowerCase().includes(q)&&!m.type.toLowerCase().includes(q))return false;
    }
    const y=parseInt(m.date.substring(0,4));
    if(y<parseInt(yearFrom)||y>parseInt(yearTo))return false;
    return true;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));
}

function render(){
  // Update type button states
  document.querySelectorAll("#typeButtons .type-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.type===typeFilter);
  });
  document.querySelectorAll("#catButtons .type-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.cat===catFilter);
  });

  const filtered=getFiltered();
  document.getElementById("filteredCount").textContent=filtered.length;

  // Stats dashboard
  const statsBar=document.getElementById("statsBar");
  if(filtered.length>0){
    const openCount=filtered.filter(m=>m.open).length;
    const pctOpen=Math.round(openCount/filtered.length*100);
    const avgIntel=Math.round(filtered.reduce((s,m)=>s+m.intelligence,0)/filtered.length);
    const maxIntelModel=filtered.reduce((a,b)=>b.intelligence>a.intelligence?b:a);
    const companyCount={};filtered.forEach(m=>{companyCount[m.company]=(companyCount[m.company]||0)+1});
    const topCompany=Object.entries(companyCount).sort((a,b)=>b[1]-a[1])[0];
    statsBar.innerHTML=`<span class="stat-item">${t('showing')} <b>${filtered.length}</b></span><span class="stat-item">${t('openPct')} <b>${pctOpen}%</b></span><span class="stat-item">${t('avgIntel')} <b>${avgIntel}</b></span><span class="stat-item">${t('top')} <b>${topCompany[0]}</b> (${topCompany[1]})</span><span class="stat-item">${t('maxIntel')} <b>${maxIntelModel.name}</b> (${maxIntelModel.intelligence})</span>`;
  }else{
    statsBar.innerHTML=`<span class="stat-item">${t('noRes')}</span>`;
  }

  const baseChartStart=new Date(yearFrom+"-01-01").getTime();
  const baseChartEnd=new Date(yearTo==="2026"?"2026-04-15":(parseInt(yearTo)+1)+"-01-01").getTime();
  const chartStart=chartZoom?chartZoom.dateStart:baseChartStart;
  const chartEnd=chartZoom?chartZoom.dateEnd:baseChartEnd;
  const chartRange=chartEnd-chartStart;
  const intelMin=chartZoom?chartZoom.intelMin:0;
  const intelMax=chartZoom?chartZoom.intelMax:100;
  const intelRange=intelMax-intelMin;
  const visibleYears=allYears.filter(y=>{const ts=new Date(y+"-01-01").getTime();return ts>=chartStart&&ts<=chartEnd});

  // Build chart
  const chart=document.getElementById("chart");
  chart.innerHTML="";
  chart.classList.toggle("crosshair",!chartZoom);

  // Reset zoom button
  if(chartZoom){
    const resetBtn=document.createElement("button");
    resetBtn.className="zoom-reset";
    resetBtn.textContent="Reset Zoom";
    resetBtn.addEventListener("click",e=>{e.stopPropagation();chartZoom=null;render()});
    chart.appendChild(resetBtn);
    const d1=new Date(chartStart),d2=new Date(chartEnd);
    const infoEl=document.createElement("div");
    infoEl.className="zoom-info";
    infoEl.textContent=`${d1.toLocaleDateString(t('loc'),{month:"short",year:"numeric"})} – ${d2.toLocaleDateString(t('loc'),{month:"short",year:"numeric"})} · Intel ${Math.round(intelMin)}–${Math.round(intelMax)}`;
    chart.appendChild(infoEl);
  }

  // Y grid — dynamic ticks
  const yStep=intelRange<=20?2:intelRange<=50?5:10;
  const yStart=Math.ceil(intelMin/yStep)*yStep;
  for(let v=yStart;v<=intelMax;v+=yStep){
    const frac=(v-intelMin)/intelRange;
    const top=`calc(${PT}px + ${(1-frac)} * (100% - ${PT+PB}px))`;
    const line=document.createElement("div");
    line.className="grid-line-y";
    line.style.cssText=`position:absolute;left:${PL}px;right:${PR}px;top:${top};height:1px;background:${v===intelMin?"var(--grid-base)":"var(--grid-line)"}`;
    chart.appendChild(line);
    const lbl=document.createElement("span");
    lbl.className="grid-label-y";
    lbl.style.top=top;
    lbl.textContent=v;
    chart.appendChild(lbl);
  }

  // X grid
  visibleYears.forEach(yr=>{
    const ts=new Date(yr+"-01-01").getTime();
    const pct=(ts-chartStart)/chartRange;
    if(pct<0||pct>1)return;
    const left=`calc(${PL}px + ${pct} * (100% - ${PL+PR}px))`;
    const line=document.createElement("div");
    line.style.cssText=`position:absolute;top:${PT}px;bottom:${PB}px;left:${left};width:1px;background:var(--grid-line)`;
    chart.appendChild(line);
    const lbl=document.createElement("span");
    lbl.className="grid-label-x";
    lbl.style.left=left;
    lbl.textContent=yr;
    chart.appendChild(lbl);
  });

  // Y label
  const yLabel=document.createElement("div");
  yLabel.className="y-axis-label";
  yLabel.textContent=t('yAxis');
  chart.appendChild(yLabel);

  // Points
  filtered.forEach((m,i)=>{
    const ts=new Date(m.date).getTime();
    const xP=(ts-chartStart)/chartRange;
    const yP=(m.intelligence-intelMin)/intelRange;
    if(chartZoom&&(xP<-0.02||xP>1.02||yP<-0.02||yP>1.02))return;
    const left=`calc(${PL}px + ${xP} * (100% - ${PL+PR}px))`;
    const top=`calc(${PT}px + ${(1-yP)} * (100% - ${PT+PB}px))`;

    const dot=document.createElement("div");
    dot.className="point "+(m.open?"open-point":"closed-point");
    dot.style.cssText=`left:${left};top:${top};width:9px;height:9px;z-index:2`;

    // Tooltip positioning
    const tipBelow=yP>0.72;
    const tipAlignLeft=xP<0.15;
    const tipAlignRight=xP>0.85;

    let tipStyle="";
    if(tipBelow)tipStyle+="top:calc(100% + 10px);";
    else tipStyle+="bottom:calc(100% + 10px);";
    if(tipAlignLeft)tipStyle+="left:0;transform:none;";
    else if(tipAlignRight)tipStyle+="right:0;transform:none;";
    else tipStyle+="left:50%;transform:translateX(-50%);";

    const linkHtml=m.url&&m.url!=='#'?`<a class="t-link" href="${m.url}" target="_blank" rel="noopener">↗</a>`:'';
    dot.innerHTML=`<div class="tooltip" style="${tipStyle};pointer-events:auto">
      <div class="t-name"><span style="color:var(--t-faint);font-size:10px">#${m.chronoNum}</span> ${m.name}${linkHtml}</div>
      <div class="t-meta">${m.company} · ${m.date}</div>
      <div class="t-stats">Intel: <b>${m.intelligence}</b> · ${m.type} · ${m.open?"Open":"Closed"}</div>
    </div>`;

    dot.addEventListener("mouseenter",()=>{dot.style.width="16px";dot.style.height="16px";dot.style.zIndex="100"});
    dot.addEventListener("mouseleave",()=>{dot.style.width="9px";dot.style.height="9px";dot.style.zIndex="2"});
    dot.addEventListener("click",e=>{
      e.stopPropagation();
      const card=document.getElementById("card-"+m.chronoNum);
      if(!card)return;
      card.scrollIntoView({behavior:"smooth",block:"center"});
      card.classList.remove("highlight");
      void card.offsetWidth;
      card.classList.add("highlight");
    });

    chart.appendChild(dot);
  });

  // Trend line
  if(filtered.length>=3){
    const sorted=[...filtered].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const numSamples=50;
    const points=[];
    for(let s=0;s<=numSamples;s++){
      const t=chartStart+(s/numSamples)*chartRange;
      const windowSize=chartRange*0.08;
      const nearby=sorted.filter(m=>{
        const mt=new Date(m.date).getTime();
        return Math.abs(mt-t)<=windowSize;
      });
      if(nearby.length===0)continue;
      const totalWeight=nearby.reduce((sum,m)=>sum+m.intelligence*m.intelligence,0);
      const weightedSum=nearby.reduce((sum,m)=>sum+m.intelligence*m.intelligence*m.intelligence,0);
      const wAvg=totalWeight>0?weightedSum/totalWeight:0;
      const xPct=(t-chartStart)/chartRange;
      const yPct=(wAvg-intelMin)/intelRange;
      points.push({x:xPct,y:yPct});
    }
    if(points.length>=2){
      const mL=4.8,mR=1.4,mT=1.4,mB=3.6;
      const svgX=xP=>mL+xP*(100-mL-mR);
      const svgY=yP=>mT+(1-yP)*(100-mT-mB);
      const pathD=points.map((p,i)=>`${i===0?'M':'L'} ${svgX(p.x).toFixed(2)} ${svgY(p.y).toFixed(2)}`).join(' ');
      const ns="http://www.w3.org/2000/svg";
      const svg=document.createElementNS(ns,"svg");
      svg.setAttribute("class","trend-svg");
      svg.setAttribute("viewBox","0 0 100 100");
      svg.setAttribute("preserveAspectRatio","none");
      svg.innerHTML=`<defs><linearGradient id="trendGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/><stop offset="25%" stop-color="#f97316" stop-opacity="0.45"/><stop offset="50%" stop-color="#eab308" stop-opacity="0.6"/><stop offset="75%" stop-color="#22c55e" stop-opacity="0.8"/><stop offset="100%" stop-color="#10b981" stop-opacity="1"/></linearGradient><linearGradient id="trendGlow" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.05"/><stop offset="50%" stop-color="#eab308" stop-opacity="0.08"/><stop offset="100%" stop-color="#10b981" stop-opacity="0.15"/></linearGradient></defs><path d="${pathD}" fill="none" stroke="url(#trendGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${pathD}" fill="none" stroke="url(#trendGrad)" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      chart.appendChild(svg);
    }
  }

  // Update sort button states
  document.getElementById("sortDate").classList.toggle("active",sortMode==="date");
  document.getElementById("sortIntel").classList.toggle("active",sortMode==="intelligence");

  // Precompute comparison stats for tooltips
  const sameTypeModels={};
  filtered.forEach(m=>{if(!sameTypeModels[m.type])sameTypeModels[m.type]=[];sameTypeModels[m.type].push(m)});
  const globalMaxIntel=filtered.length?Math.max(...filtered.map(m=>m.intelligence)):100;
  const globalAvgIntel=filtered.length?Math.round(filtered.reduce((s,m)=>s+m.intelligence,0)/filtered.length):0;

  // Helper: build card HTML
  function cardHTML(m,extraPrefix){
    const tc=typeColors[m.type]||"#666";
    const metaText=`${m.company} · ${fmtDate(m.date)}`;
    const metaContent=m.url&&m.url!=='#'?`<a href="${m.url}" target="_blank" rel="noopener">${metaText}</a>`:metaText;
    const prefix=extraPrefix||'';
    const newBadge=isNewModel(m)?'<span class="badge badge-new">NEW</span>':'';
    // Mini comparison chart for tooltip
    const typeArr=sameTypeModels[m.type]||[];
    const typeAvg=typeArr.length?Math.round(typeArr.reduce((s,x)=>s+x.intelligence,0)/typeArr.length):0;
    const typeMax=typeArr.length?Math.max(...typeArr.map(x=>x.intelligence)):0;
    const tipHtml=`<div class="card-tooltip"><div class="ct-name">${m.name}</div><div class="ct-bars"><div class="ct-row"><span>${t('thisM')}</span><b>${m.intelligence}</b><div class="ct-bar-bg"><div class="ct-bar-fill ct-bar-this" style="width:${m.intelligence}%"></div></div></div><div class="ct-row"><span>${t('avg')} ${m.type}</span><b>${typeAvg}</b><div class="ct-bar-bg"><div class="ct-bar-fill ct-bar-avg" style="width:${typeAvg}%"></div></div></div><div class="ct-row"><span>${t('max')} ${m.type}</span><b>${typeMax}</b><div class="ct-bar-bg"><div class="ct-bar-fill ct-bar-max" style="width:${typeMax}%"></div></div></div></div><div class="ct-label">${t('vs')} ${typeArr.length} ${t('models')} ${m.type}</div></div>`;
    return `<div class="accent" style="background:${tc}"></div><div class="card-top"><div class="card-info"><div class="card-name">${prefix}<span class="card-number">#${m.chronoNum}</span> ${m.name}</div><div class="card-meta">${metaContent}</div></div><div class="badges">${newBadge}${m.open?'<span class="badge badge-open">OPEN</span>':''}<span class="badge" style="background:${tc}18;color:${tc}">${m.type.toUpperCase()}</span></div></div><div class="bar-section"><div class="bar-label animate">INTEL ${m.intelligence}</div><div class="bar-bg"><div class="bar-fill animate" style="--bar-w:${m.intelligence}%;width:${m.intelligence}%"></div></div></div>${tipHtml}`;
  }

  // Timeline list
  const timeline=document.getElementById("timeline");
  timeline.innerHTML="";

  if(sortMode==="intelligence"){
    // Flat grid sorted by intelligence descending
    const byIntel=[...filtered].sort((a,b)=>b.intelligence-a.intelligence||new Date(b.date)-new Date(a.date));
    const section=document.createElement("div");
    section.className="year-section";
    section.innerHTML=`<div class="year-header"><span class="year-title">${t('intelRank')}</span><span class="year-count">${byIntel.length} ${t('models')}</span><div class="year-line"></div></div>`;
    const grid=document.createElement("div");
    grid.className="cards-grid";
    byIntel.forEach((m,i)=>{
      const card=document.createElement("div");
      card.className="card";
      card.id="card-"+m.chronoNum;
      card.innerHTML=cardHTML(m,`<span class="intel-rank">🏆#${i+1}</span> `);
      const delay=Math.min(i*15,800);
      const fill=card.querySelector(".bar-fill");
      const lbl=card.querySelector(".bar-label");
      if(fill)fill.style.animationDelay=delay+"ms";
      if(lbl)lbl.style.animationDelay=delay+"ms";
      grid.appendChild(card);
    });
    section.appendChild(grid);
    timeline.appendChild(section);
  } else {
    // Date mode: grouped by year
    const byYear={};
    allYears.forEach(y=>byYear[y]=[]);
    filtered.forEach(m=>{const y=m.date.substring(0,4);if(byYear[y])byYear[y].push(m)});

    [...allYears].reverse().forEach(year=>{
      const ym=byYear[year];
      if(!ym||ym.length===0)return;
      const section=document.createElement("div");
      section.className="year-section";
      section.innerHTML=`<div class="year-header"><span class="year-title">${year}</span><span class="year-count">${ym.length} ${t('models')}</span><div class="year-line"></div></div>`;
      const grid=document.createElement("div");
      grid.className="cards-grid";
      ym.forEach((m,i)=>{
        const card=document.createElement("div");
        card.className="card";
        card.id="card-"+m.chronoNum;
        card.innerHTML=cardHTML(m);
        const delay=Math.min(i*15,800);
        const fill=card.querySelector(".bar-fill");
        const lbl=card.querySelector(".bar-label");
        if(fill)fill.style.animationDelay=delay+"ms";
        if(lbl)lbl.style.animationDelay=delay+"ms";
        grid.appendChild(card);
      });
      section.appendChild(grid);
      timeline.appendChild(section);
    });
  }
}

// --- Drag-to-zoom on chart ---
(function(){
  const chart=document.getElementById("chart");
  let dragging=false,startX=0,startY=0,selBox=null;

  function chartCoords(e){
    const r=chart.getBoundingClientRect();
    return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height};
  }

  function pxToData(x,y,w,h){
    const innerW=w-PL-PR, innerH=h-PT-PB;
    const xFrac=Math.max(0,Math.min(1,(x-PL)/innerW));
    const yFrac=Math.max(0,Math.min(1,(y-PT)/innerH));
    // Current chart ranges — read from last render
    const cStart=chartZoom?chartZoom.dateStart:new Date(yearFrom+"-01-01").getTime();
    const cEnd=chartZoom?chartZoom.dateEnd:new Date(yearTo==="2026"?"2026-04-15":(parseInt(yearTo)+1)+"-01-01").getTime();
    const iMin=chartZoom?chartZoom.intelMin:0;
    const iMax=chartZoom?chartZoom.intelMax:100;
    const date=cStart+xFrac*(cEnd-cStart);
    const intel=iMax-(yFrac*(iMax-iMin));
    return{date,intel};
  }

  chart.addEventListener("mousedown",e=>{
    if(e.button!==0)return;
    // Don't start drag if clicking on a point, button, or tooltip
    if(e.target.closest(".point")||e.target.closest(".zoom-reset")||e.target.closest(".tooltip"))return;
    dragging=true;
    const c=chartCoords(e);
    startX=c.x;startY=c.y;
    selBox=document.createElement("div");
    selBox.className="zoom-sel";
    selBox.style.cssText=`left:${startX}px;top:${startY}px;width:0;height:0`;
    chart.appendChild(selBox);
    e.preventDefault();
  });

  document.addEventListener("mousemove",e=>{
    if(!dragging||!selBox)return;
    const c=chartCoords(e);
    const x=Math.max(0,Math.min(c.w,c.x));
    const y=Math.max(0,Math.min(c.h,c.y));
    const left=Math.min(startX,x),top=Math.min(startY,y);
    const w=Math.abs(x-startX),h=Math.abs(y-startY);
    selBox.style.left=left+"px";
    selBox.style.top=top+"px";
    selBox.style.width=w+"px";
    selBox.style.height=h+"px";
  });

  document.addEventListener("mouseup",e=>{
    if(!dragging)return;
    dragging=false;
    if(selBox){selBox.remove();selBox=null}
    const c=chartCoords(e);
    const endX=Math.max(0,Math.min(c.w,c.x));
    const endY=Math.max(0,Math.min(c.h,c.y));
    const dx=Math.abs(endX-startX),dy=Math.abs(endY-startY);
    // Minimum drag size to trigger zoom (prevent accidental clicks)
    if(dx<20||dy<20)return;
    const corner1=pxToData(Math.min(startX,endX),Math.min(startY,endY),c.w,c.h);
    const corner2=pxToData(Math.max(startX,endX),Math.max(startY,endY),c.w,c.h);
    const dateStart=corner1.date;
    const dateEnd=corner2.date;
    const intelMax2=corner1.intel;
    const intelMin2=corner2.intel;
    if(dateEnd-dateStart<86400000*7)return; // min 1 week range
    if(intelMax2-intelMin2<3)return; // min 3 intel range
    chartZoom={dateStart,dateEnd,intelMin:Math.max(0,intelMin2-1),intelMax:Math.min(100,intelMax2+1)};
    render();
  });

  // Double-click to reset zoom
  chart.addEventListener("dblclick",e=>{
    if(e.target.closest(".point")||e.target.closest(".zoom-reset"))return;
    if(chartZoom){chartZoom=null;render()}
  });
})();

// --- Dark / Light theme toggle ---
(function(){
  const btn=document.getElementById("themeBtn");
  const saved=localStorage.getItem("theme");
  if(saved==="light"){document.documentElement.classList.add("light");btn.textContent="Dark"}
  function toggle(){
    const isLight=document.documentElement.classList.toggle("light");
    btn.textContent=isLight?"Dark":"Light";
    localStorage.setItem("theme",isLight?"light":"dark");
  }
  btn.addEventListener("click",toggle);
})();
</script>
